<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="align-items: center;">

    <div id="follow-container" class="alert-box follow-alert">
        <div class="icon-container highlight-purple">
            <pre class="ascii-icon">
     /\ 
    /__\ 
   /    \
            </pre>
        </div>
        <div class="text-content">
            <span class="event-type">NOVO SEGUIDOR</span>
            <span class="username" id="alert-follower-name"></span>
        </div>
    </div>

    <div id="sub-container" class="alert-box sub-alert">
        <div class="icon-container highlight-yellow"><span class="special-char">𝔾</span></div>
        <div class="text-content">
            <span class="event-type">NOVO INSCRITO</span>
            <span class="username" id="alert-sub-name"></span>
        </div>
    </div>

    <div id="bits-container" class="alert-box bits-alert">
        <div class="icon-container highlight-cyan"><span class="special-char">∞</span></div>
        <div class="text-content">
            <span class="event-type">BITS RECEBIDOS</span>
            <span class="username" id="alert-bits-name"></span>
            <span class="details"><strong id="alert-bits-amount" class="highlight-cyan"></strong> bits!</span>
        </div>
    </div>

    <div id="hype-container" class="alert-box hype-alert">
        <div class="icon-container highlight-pink"><span class="special-char">🚂</span></div>
        <div class="text-content">
            <span class="event-type">HYPE TRAIN INICIADO!</span>
            <span class="username">NÍVEL <span id="alert-hype-level"></span></span>
            <span class="details">Todos a bordo!</span>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
