<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>OBS Bot - Coding Overlay</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
      body {
        background: transparent;
        color: var(--text-main);
        font-family: "Fira Code", monospace;
        padding: 20px;
      }
      .panel {
        border: 1px solid var(--panel-border);
        background: var(--panel-bg);
        border-radius: 8px;
        padding: 15px 20px;
        width: 380px;
        position: relative;
      }
      .panel::before {
        content: "";
        position: absolute;
        top: -1px;
        left: 10px;
        width: 30px;
        height: 2px;
        background: var(--purple);
        box-shadow: 0 0 8px var(--purple);
      }
      .title {
        font-size: 0.75rem;
        color: var(--purple);
        font-weight: 700;
        margin-bottom: 15px;
      }
      .dir {
        color: var(--text-light);
        margin-bottom: 15px;
        font-weight: 500;
        font-size: 0.95rem;
      }
      .git {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--cyan);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="title">&lt;/&gt; NOW WORKING ON</div>
      <div class="dir" id="dir-path">Aguardando...</div>
      <div class="git">
        <span>⑂ <span id="git-branch">-</span></span>
        <span id="git-status">-</span>
      </div>
    </div>
    <script src="assets/js/app.js"></script>
  </body>
</html>
